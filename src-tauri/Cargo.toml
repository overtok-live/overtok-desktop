[package]
name = "overtok-desktop"
version = "0.1.3"
description = "Overtok for the desktop: the dashboard in its own window, in the tray, updating itself."
authors = ["Overtok"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "overtok_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rand = "0.8"
semver = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# Windows: the app plays the sound page's sound itself, so LIVE Studio's Application source of
# Overtok.exe carries it (app_audio.rs). macOS: only to try it (OVERTOK_AUDIO_TAP).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
